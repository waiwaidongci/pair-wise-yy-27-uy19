<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}button.sub{background:#2f6b3a}button.bad{background:#8a2f2f}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px 8px;text-align:left}.pending{color:#8a2f2f;font-weight:bold}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>字位校记（按对齐文本序号登记）</h2><p>字位序号从 1 起；普通字符一位，<code>[不可辨]</code> 等标记整体一位。原字由系统按当前对齐层登记，拟字限单个字位；<code>[缺页]</code>/<code>[残损]</code> 缺口不能当确定文字。</p><div class="grid"><input id="emPassage" type="number" placeholder="段落 ID"><input id="emWitness" type="number" placeholder="版本 ID"><input id="emUser" type="number" placeholder="登记人 ID"><input id="emPos" type="number" placeholder="字位序号"><input id="emChar" placeholder="拟字（单字）"><input id="emBasis" placeholder="校勘依据"><input id="emRev" type="number" value="0" placeholder="基于修订号"></div><button onclick="submitEm()">登记校记</button> <button onclick="listEm()">查询该对齐校记</button><pre id="emResult"></pre></section><section><h2>校记审定</h2><div class="grid"><input id="rvId" type="number" placeholder="校记 ID"><input id="rvUser" type="number" placeholder="审阅人 ID"><input id="rvReason" placeholder="驳回原因（驳回必填）"><input id="rvRev" type="number" placeholder="基于修订号（可选）"></div><button class="sub" onclick="review('approve')">通过（成为当前释文）</button><button class="bad" onclick="review('reject')">驳回（写明原因退回）</button><button onclick="resubmit()">失效/驳回后重新提交</button><pre id="rvResult"></pre></section><section><h2>校勘稿导出（释文与未决字位）</h2><input id="exWork" type="number" placeholder="作品 ID"><input id="exUser" type="number" placeholder="用户 ID"><button onclick="exportC()">导出校勘稿</button><div id="exportView"></div><pre id="exResult"></pre></section><script>
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
async function state(){show('#state',await(await fetch('/api/state')).json())}
function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}
function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}
function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}
function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}
function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}
function submitEm(){post('/api/emendations',{passage_id:+emPassage.value,witness_id:+emWitness.value,position:+emPos.value,proposed_char:emChar.value,basis:emBasis.value,user_id:+emUser.value,expected_revision:+emRev.value},'#emResult')}
function listEm(){get('/api/emendations?passage_id='+emPassage.value+'&witness_id='+emWitness.value+'&user_id='+emUser.value,'#emResult')}
function review(action){
 const body={emendation_id:+rvId.value,reviewer_id:+rvUser.value,reason:rvReason.value};
 if(rvRev.value.trim()!=="")body.expected_revision=+rvRev.value;
 post('/api/emendations/'+action,body,'#rvResult')}
function resubmit(){post('/api/emendations/'+rvId.value+'/resubmit',{user_id:+rvUser.value,expected_revision:+(rvRev.value||0)},'#rvResult')}
const STATUS={pending:'待审',approved:'已通过',rejected:'已驳回',stale:'异文层变化失效'};
function exportC(){
 const e='#exResult',v='#exportView';
 document.querySelector(v).textContent='加载中…';show(e,{});
 fetch('/api/works/'+exWork.value+'/collation?user_id='+exUser.value).then(r=>r.json()).then(d=>{
  show(e,d);
  if(!d.ok&&d.error!==undefined){document.querySelector(v).textContent='';return}
  let html='<p>缺口数：'+d.gap_count+'；未决字位：<span class="pending">'+d.unresolved_count+'</span></p>';
  for(const ps of d.passages){
   html+='<h3>'+ps.label+'（修订号 '+ps.revision+'，'+(ps.status==='locked'?'已锁定':'开放')+'）</h3><table><tr><th>版本</th><th>当前释文</th><th>未决字位</th></tr>';
   for(const a of ps.alignments){
    const pend=a.pending_positions.map(p=>'#'+p.position+'（原 '+p.original_char+' → 拟 '+p.proposed_char+'，'+STATUS[p.status]+'）').join('；')||'无';
    html+='<tr><td>'+a.siglum+'</td><td>'+a.reading+'</td><td class="'+(a.pending_positions.length?'pending':'')+'">'+pend+'</td></tr>';
   }
   html+='</table>';
  }
  document.querySelector(v).innerHTML=html;
 });
}
state()
</script></html>
