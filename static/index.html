<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="addVariant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>字位校记登记</h2><p>按对齐文本序号登记原字、拟字与依据；同一字位只留一张待审校记，缺页、残损等标记不能当作确定文字。</p><input id="cnvariant" type="number" placeholder="异文 ID"><input id="cnpos" type="number" placeholder="字位序号"><input id="cnorig" placeholder="原字"><input id="cnprop" placeholder="拟字"><input id="cnev" placeholder="依据" size="28"><button onclick="addNote()">登记校记</button><pre id="cnout"></pre></section><section><h2>校记审阅与校勘稿</h2><input id="cnnote" type="number" placeholder="校记 ID"><select id="cnaction"><option value="approve">通过</option><option value="reject">驳回</option></select><input id="cnreason" placeholder="驳回原因（驳回必填）"><button onclick="listNotes()">查看段落校记</button><button onclick="reviewNote()">提交审阅</button><button onclick="exportWork()">导出校勘稿（释文与未决字位）</button><pre id="review"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function addVariant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}function addNote(){post('/api/char-notes',{variant_id:+cnvariant.value,position:+cnpos.value,original_char:cnorig.value,proposed_char:cnprop.value,evidence:cnev.value,user_id:+user.value},'#cnout')}function listNotes(){get('/api/passages/'+passage.value+'/char-notes?user_id='+user.value,'#review')}function reviewNote(){post('/api/char-notes/'+cnnote.value+'/review',{user_id:+user.value,action:cnaction.value,reason:cnreason.value},'#review')}function exportWork(){get('/api/works/'+work.value+'/collation?user_id='+user.value,'#review')}state()</script></html>
